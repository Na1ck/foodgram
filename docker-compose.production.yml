volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  
  backend:
    image: naick/foodgram_backend
    env_file: .env
    volumes:
      - static:/app/backend_static
      - media:/app/media
    depends_on:
      - db
  
  frontend:
    image: naick/foodgram_frontend 
    command: cp -r /app/build/. /frontend_static/ 
    volumes: 
      - static:/frontend_static
  
  gateway:
    image: naick/foodgram_gateway
    ports:
      - ${HOST_PORT}:${CONTAINER_PORT}
    volumes:
      - static:/staticfiles
      - static:/backend_static
      - media:/media
    depends_on:
      - backend