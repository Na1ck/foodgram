volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    image: naick/foodgram_backend
    env_file: .env
    volumes:
      - static:/backend_static
      - media:/media
    depends_on:
      - db
  frontend:
    env_file: .env
    image: naick/foodgram_frontend
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static
  gateway:
    image: naick/foodgram_gateway
    env_file: .env
    ports:
      - ${HOST_PORT}:${CONTAINER_PORT}
    volumes:
      - static:/backend_static
      - static:/staticfiles
      - media:/media
    depends_on:
      - backend