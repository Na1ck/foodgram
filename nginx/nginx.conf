server {
  listen 80;
  index index.html;

  location /s/ {
      proxy_set_header Host $host;
      proxy_pass http://backend:8000/s/;
  }

  location /api/ {
    proxy_set_header Host $host;
    proxy_pass http://backend:8000/api/;
  }
  location /admin/ {
    proxy_set_header Host $host;
    proxy_pass http://backend:8000/admin/;
  }

  location /media/ {
    alias /media/;
    try_files $uri $uri/ =404;
  }

  location / {
    alias /staticfiles/;
    index index.html;
  }
}